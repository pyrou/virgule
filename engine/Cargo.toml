[package]
name = "virgule_engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
crate-type = ["staticlib"]

[dependencies]
regex = "1.12.4"
rusqlite = { version = "0.37", features = ["bundled", "functions", "hooks", "modern_sqlite"] }

[profile.release]
lto = "thin"
codegen-units = 1
